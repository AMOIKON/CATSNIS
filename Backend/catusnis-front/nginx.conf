server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ✅ ^~ /api/ — priorité absolue sur la regex *.png
    location ^~ /api/ {
        proxy_pass         http://catusnis-app:8081/api/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Authorization     $http_authorization;
        proxy_set_header   Content-Type      $content_type;

        # ✅ Timeouts augmentés pour dashboard/stats
        proxy_connect_timeout 300s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;

        proxy_request_buffering off;
        client_max_body_size    50M;

        # ✅ Désactiver le cache pour les images uploadées
        add_header Cache-Control "no-cache, no-store";
    }

    # ✅ Assets statiques — exclut explicitement /api/
    location ~* ^(?!/api/).*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ✅ React Router — en dernier
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        image/svg+xml;
}