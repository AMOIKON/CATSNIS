server:
  port: 8082

spring:
  application:
    name: dno

  # ── Swagger / OpenAPI ──────────────────────────────────────────────────────
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    config-url: /api-docs/swagger-config
    url: /api-docs

  # ── Datasource MySQL ───────────────────────────────────────────────────────
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/catusnis_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci}
    username: ${SPRING_DATASOURCE_USERNAME:catusnis_user}
    password: ${SPRING_DATASOURCE_PASSWORD:catusnis_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout:        30000
      initialization-fail-timeout: 60000
      maximum-pool-size:         5

  # ── JPA / Hibernate ────────────────────────────────────────────────────────
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
    naming:
      physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        connection.characterEncoding: utf8mb4
        connection.useUnicode: true

  # ── SQL init ───────────────────────────────────────────────────────────────
  sql:
    init:
      mode: always
      platform: mysql
      continue-on-error: true

  # ── Upload multipart — 30 Mo ───────────────────────────────────────────────
  servlet:
    multipart:
      enabled: true
      max-file-size: 30MB
      max-request-size: 32MB
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true

# ── Actuator / Health ──────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: "*"
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    db:
      enabled: false
    diskspace:
      enabled: false
    ping:
      enabled: true
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  security:
    enabled: false

# ── JWT ────────────────────────────────────────────────────────────────────────
jwt:
  secret:             ${JWT_SECRET:K7gNU3sdo+OL0wNhqoVWhr3g6s1xYv72ol/pe/Unols=}
  expiration:         604800000
  refresh-expiration: 2592000000

# ── Logging ────────────────────────────────────────────────────────────────────
logging:
  level:
    org.springframework.security: DEBUG

# ── Application ────────────────────────────────────────────────────────────────
app:
  upload:
    dir:          ${APP_UPLOAD_DIR:/app/uploads/images}
    archives-dir: ${APP_ARCHIVES_DIR:/app/uploads/archives}
  server:
    url: ${APP_SERVER_URL:http://localhost:8081}
  # ✅ URL du frontend (pas le backend) — utilisée pour construire les liens
  #    de vérification (QR code des fiches PDF, etc.)
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:3001}
  admin:
    email:    ${APP_ADMIN_EMAIL:superadmin@catusnis.ci}
    password: ${APP_ADMIN_PASSWORD:SuperAdmin@2024}