server:
  port: 8082

spring:
  application:
    name: dno

  # ── Swagger / OpenAPI ──────────────────────────────────────────────────────
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    config-url: /api-docs/swagger-config
    url: /api-docs

  # ── Datasource MySQL ───────────────────────────────────────────────────────
  datasource:
    # ✅ useUnicode + characterEncoding ajoutés pour UTF-8 correct
    url: jdbc:mysql://localhost:3307/catusnis_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8
    username: catusnis_user
    password: catusnis_password
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      initialization-fail-timeout: 60000

  # ── JPA / Hibernate ────────────────────────────────────────────────────────
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    defer-datasource-initialization: true
    naming:
      physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # ── SQL init ───────────────────────────────────────────────────────────────
  sql:
    init:
      mode: always
      platform: mysql
      continue-on-error: true

  # ── Upload multipart — 30 Mo ───────────────────────────────────────────────
  servlet:
    multipart:
      enabled: true
      max-file-size: 30MB
      max-request-size: 32MB

# ── JWT ────────────────────────────────────────────────────────────────────────
jwt:
  secret: K7gNU3sdo+OL0wNhqoVWhr3g6s1xYv72ol/pe/Unols=
  expiration: 604800000
  refresh-expiration: 2592000000

# ── Logging ────────────────────────────────────────────────────────────────────
logging:
  level:
    org.springframework.security: DEBUG

# ── Application ────────────────────────────────────────────────────────────────
app:
  upload:
    dir: ${APP_UPLOAD_DIR:/app/uploads/images}
    archives-dir: ${APP_ARCHIVES_DIR:/app/uploads/archives}
  server:
    url: http://localhost:8081
  admin:
    email: ${APP_ADMIN_EMAIL:superadmin@catusnis.ci}
    password: ${APP_ADMIN_PASSWORD:SuperAdmin@2024}