spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://catusnis-mysql:3306/catusnis_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci}
    username: ${SPRING_DATASOURCE_USERNAME:catusnis_user}
    password: ${SPRING_DATASOURCE_PASSWORD:catusnis_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout:          30000
      initialization-fail-timeout: 60000
      connection-test-query:       SELECT 1
      keepalive-time:              30000
      max-lifetime:                120000
      idle-timeout:                60000
      minimum-idle:                2
      maximum-pool-size:           5

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        connection.characterEncoding: utf8mb4
        connection.useUnicode: true

  sql:
    init:
      mode: always

server:
  port: ${PORT:10000}
