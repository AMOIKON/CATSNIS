spring:
  datasource:
    url: jdbc:mysql://catusnis-mysql:3306/catusnis_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&autoReconnect=true&failOverReadOnly=false
    username: catusnis_user
    password: catusnis_password
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      initialization-fail-timeout: -1
      connection-test-query: SELECT 1
      keepalive-time: 30000
      max-lifetime: 120000
      idle-timeout: 60000
      minimum-idle: 2
      maximum-pool-size: 10


  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  sql:
    init:
      mode: always

server:
  port: 8081  # ← corrige aussi ça (tu as 8080 ici mais 8081 dans docker-compose)