services:
  catusnis-mysql:
    image: mysql:8.0
    container_name: catusnis-mysql
    restart: on-failure
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: catusnis_db
      MYSQL_USER: catusnis_user
      MYSQL_PASSWORD: catusnis_password
    ports:
      - "3307:3306"
    volumes:
      - catusnis-mysql-data:/var/lib/mysql
      - ./uploads/archives:/app/uploads/archives
      # ✅ Script init exécuté au premier démarrage
      - ./sql/init_users.sql:/docker-entrypoint-initdb.d/init_users.sql
    networks:
      - catusnis-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "catusnis_user", "-pcatusnis_password"]
      interval: "20s"
      timeout: "10s"
      retries: 10
      start_period: "120s"

  catusnis-app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: catusnis-app
    restart: always
    ports:
      - "8083:8081"
    volumes:
      - catusnis-uploads:/app/uploads/images
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:mysql://catusnis-mysql:3306/catusnis_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: catusnis_user
      SPRING_DATASOURCE_PASSWORD: catusnis_password
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION: "true"
      SPRING_JPA_OPEN_IN_VIEW: "false"
      APP_UPLOAD_DIR: /app/uploads/images
    depends_on:
      catusnis-mysql:
        condition: service_healthy
    networks:
      - catusnis-network

  catusnis-front:
    build:
      context: ../../catusnis-front
      dockerfile: Dockerfile
    container_name: catusnis-front
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - catusnis-app
    networks:
      - catusnis-network

volumes:
  catusnis-mysql-data:
  catusnis-uploads:

networks:
  catusnis-network:
    driver: bridge
